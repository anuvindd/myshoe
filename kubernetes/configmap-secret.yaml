apiVersion: v1
kind: ConfigMap
metadata:
  name: myshoe-config
  labels:
    app: myshoe
data:
  DB_HOST: "myshoe-mysql.c9ak2a4s.ap-south-1.rds.amazonaws.com" # replaced by terraform output after apply - run ./scripts/update-config.sh
  DB_PORT: "3306"
  DB_NAME: "myshoe"
  DB_USER: "admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: myshoe-secret
  labels:
    app: myshoe
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_WITH_TERRAFORM_OUTPUT" # kubectl create secret generic myshoe-secret --from-literal=DB_PASSWORD=$(terraform output -raw rds_password 2>/dev/null || cat terraform/terraform.tfvars | grep db_password)
